name: Bug report
description: Something isn't converting correctly or the extension misbehaves
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill out the details below.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on the card in chrome://extensions.
      placeholder: "1.0.1"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: What were you converting?
      options:
        - PDF
        - Word (.docx)
        - Excel (.xlsx / .csv)
        - PowerPoint (.pptx)
        - Image (OCR)
        - Web page
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Include any error text from the extension's "Errors" page or the console if you can.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: "Chrome 128 on Windows 11"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmation
      options:
        - label: I am not attaching any confidential file contents I don't want public.
          required: true
