name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Check that dist/ was produced
        run: test -f dist/manifest.json && test -f dist/popup.js && test -f dist/background.js

      - name: Upload built extension
        uses: actions/upload-artifact@v4
        with:
          name: md-converter-dist
          path: dist/
