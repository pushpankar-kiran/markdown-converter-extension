<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect x="1" y="1" width="758" height="258" rx="16" fill="#faf9f5" stroke="#dcdad2" stroke-width="2"/>

  <!-- step badge -->
  <circle cx="42" cy="42" r="18" fill="#1c211f"/>
  <text x="42" y="49" text-anchor="middle" fill="#faf9f5" font-size="20" font-weight="700">1</text>
  <text x="72" y="48" fill="#1c211f" font-size="20" font-weight="700">Unzip the downloaded file</text>

  <!-- zip file -->
  <g transform="translate(120,110)">
    <rect x="0" y="0" width="120" height="150" rx="10" fill="#f1f0ea" stroke="#dcdad2" stroke-width="2"/>
    <path d="M0 12 A10 10 0 0 1 10 2 L60 2 L60 150 L10 150 A10 10 0 0 1 0 140 Z" fill="#e4efec"/>
    <!-- zipper -->
    <rect x="45" y="2" width="10" height="120" fill="#2f6f62"/>
    <rect x="46" y="6" width="8" height="6" fill="#faf9f5"/>
    <rect x="46" y="18" width="8" height="6" fill="#faf9f5"/>
    <rect x="46" y="30" width="8" height="6" fill="#faf9f5"/>
    <rect x="46" y="42" width="8" height="6" fill="#faf9f5"/>
    <rect x="42" y="118" width="16" height="20" rx="3" fill="#2f6f62"/>
    <text x="60" y="180" text-anchor="middle" fill="#565f5b" font-size="16" font-family="Consolas, monospace">.zip</text>
  </g>

  <!-- arrow -->
  <g transform="translate(300,175)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#2f6f62" stroke-width="6" stroke-linecap="round"/>
    <path d="M118 -12 L142 0 L118 12 Z" fill="#2f6f62"/>
    <text x="70" y="-20" text-anchor="middle" fill="#565f5b" font-size="14">unzip</text>
  </g>

  <!-- folder -->
  <g transform="translate(500,105)">
    <path d="M4 20 Q4 8 16 8 L60 8 Q70 8 74 18 L80 28 L150 28 Q162 28 162 40 L162 140 Q162 152 150 152 L16 152 Q4 152 4 140 Z" fill="#2f6f62"/>
    <path d="M4 42 L162 42 L162 140 Q162 152 150 152 L16 152 Q4 152 4 140 Z" fill="#3f8879"/>
    <text x="83" y="182" text-anchor="middle" fill="#1c211f" font-size="16" font-weight="700" font-family="Consolas, monospace">dist</text>
  </g>

  <text x="380" y="238" text-anchor="middle" fill="#565f5b" font-size="13">Right-click the .zip → “Extract All”. You’ll get a folder named “dist”.</text>
</svg>
